name: Kartendaten bauen

# Jeden Sonntag früh die Supermärkte und Postleitzahlen aus OpenStreetMap neu aufbereiten.
# Manuell startbar über „Run workflow“.
on:
  schedule:
    - cron: "17 2 * * 0"   # Sonntag 02:17 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: kartendaten
  cancel-in-progress: false

jobs:
  bauen:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Werkzeuge installieren
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq osmium-tool
          pip install --quiet osmium==4.3.2 shapely==2.2.0

      - name: Deutschland-Karte von Geofabrik laden
        run: |
          curl -fsSL --retry 3 -A "Schnaeppchenkoch-Kartendaten/1.0 (woechentlich, GitHub Actions)" \
            -o germany.osm.pbf https://download.geofabrik.de/europe/germany-latest.osm.pbf
          ls -lh germany.osm.pbf

      - name: Supermärkte und Postleitzahl-Grenzen herausfiltern
        run: |
          osmium tags-filter germany.osm.pbf nwr/shop=supermarket r/boundary=postal_code -o auszug.osm.pbf --overwrite
          ls -lh auszug.osm.pbf
          rm germany.osm.pbf

      - name: Daten bauen
        run: python tools/daten_bauen.py auszug.osm.pbf data

      - name: Daten speichern
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "Keine Änderungen an den Kartendaten."
          else
            git commit -m "Kartendaten aktualisiert ($(date -u +%Y-%m-%d))"
            git push
          fi
